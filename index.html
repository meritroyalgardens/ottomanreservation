
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezervasyon">
<meta name="theme-color" content="#12263F">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Ottoman Kebab House - Reservation Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
:root{--navy:#12263F;--teal:#1F7F82;--ember:#C2452D;--bg:#EDF0F2;--card:#fff;--ink:#17212b;--mute:#667584;--line:#d7dde2}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
header small{display:block;opacity:.7;font-weight:400;font-size:13px}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
main{max-width:640px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font:inherit;font-size:17px;font-weight:600;background:var(--teal);color:#fff;margin-bottom:12px;cursor:pointer}
.btn.alt{background:var(--navy)}
.btn.push{background:#fff;color:var(--navy);border:1px solid var(--line);font-size:15px;padding:13px}
.btn.push.on{background:#e6f4ea;color:#137333;border-color:#ceead6}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--line);font-size:15px;padding:10px;width:auto;display:inline-block;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.err{color:var(--ember);font-size:14px;min-height:18px;margin-top:8px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead b{font-size:18px;text-transform:capitalize}
.calhead button{background:var(--bg);border:0;border-radius:8px;width:40px;height:36px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:15px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.day i{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--teal);border-radius:6px;padding:0 5px;min-height:15px}
.day i:empty{visibility:hidden}
.day.off{background:#e3e6e9;color:#9aa5af;border-style:dashed}
.day.today{border:2px solid var(--ember)}
.day.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.day.sel i{background:#fff;color:var(--navy)}
.item{border-left:5px solid var(--teal);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .nm{font-weight:800;font-size:18px}
.item .tm{font-weight:800;font-size:20px;color:var(--teal)}
.item .meta{font-size:14px;color:var(--mute);margin-top:4px;line-height:1.5}
.item .meta b{color:var(--ink)}
.item .row{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:14px}
.item a{color:var(--teal);font-weight:600;text-decoration:none}
.item .del{margin-left:auto;background:none;border:0;color:var(--ember);font:inherit;font-size:14px}
.total{background:var(--ember);color:#fff;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.total b{font-size:34px;font-weight:800}
.empty{color:var(--mute);text-align:center;padding:18px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:14px;border-radius:12px;text-align:center;z-index:9}
.hint{font-size:13px;color:var(--mute);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.45}
@media (prefers-color-scheme:dark){:root{--bg:#0e1620;--card:#18232f;--ink:#e8edf1;--mute:#93a1ae;--line:#2c3a48}input,textarea,.day,.item{background:#18232f;color:var(--ink)}.day.off{background:#111a23}.day.sel{background:var(--teal)}.calhead button{background:#223142;color:var(--ink)}.btn.push{background:#18232f;color:var(--ink)}}
</style>
</head>

<body>
<header>
<h1>Ottoman Kebab House<small>Reservation Panel</small></h1>
<button id="logout" class="hidden">Çıkış</button>
</header>

<main>

<section id="vLogin" class="card hidden">
<label>E-posta</label>
<input id="email" type="email" autocomplete="username" autocapitalize="none">
<label>Şifre</label>
<input id="pass" type="password" autocomplete="current-password">
<div class="err" id="loginErr"></div>
<button class="btn" id="loginBtn" style="margin-top:8px">Giriş yap</button>
</section>

<section id="vHome" class="hidden">
<p id="hello" style="color:var(--mute);margin:4px 0 16px"></p>
<button class="btn" data-go="list">Rezervasyonlar</button>
<button class="btn alt" data-go="form">Rezervasyon Girişi</button>
<button class="btn push" id="pushBtn">🔔 Kilit Ekranı Bildirimlerini Aç</button>
<div id="pushHint" class="hint hidden"></div>
</section>

<section id="vList" class="hidden">
<button class="btn ghost" data-go="home">‹ Ana ekran</button>
<div class="card">
<div class="calhead">
<button id="prev">‹</button>
<b id="monthLbl"></b>
<button id="next">›</button>
</div>
<div class="grid" id="dows"></div>
<div class="grid" id="cal" style="margin-top:4px"></div>
<div style="font-size:12px;color:var(--mute);margin-top:8px">Rozet: o günün toplam pax sayısı. Pazartesi kapalı.</div>
</div>
<h3 id="dayLbl" style="margin:16px 2px 10px"></h3>
<div id="items"></div>
<div class="total"><span>Toplam pax</span><b id="totalPax">0</b></div>
<button class="btn" id="addForDay" style="margin-top:14px">Bu güne rezervasyon ekle</button>
</section>

<section id="vForm" class="hidden">
<button class="btn ghost" data-go="home">‹ Ana ekran</button>
<div class="card">
<label>Ad</label><input id="fFirst" autocomplete="off">
<label>Soyad</label><input id="fLast" autocomplete="off">
<label>Tarih</label><input id="fDate" type="date">
<label>Saat</label><input id="fTime" type="time">
<label>Telefon</label><input id="fPhone" type="tel" inputmode="tel">
<label>Kaç pax</label><input id="fGuests" type="number" min="1" inputmode="numeric">
<label>Rezervasyonu alan kişi</label><input id="fTaker" autocomplete="off">
<label>Not (isteğe bağlı)</label><textarea id="fNote" rows="2"></textarea>
<div class="err" id="formErr"></div>
<button class="btn" id="saveBtn" style="margin-top:8px">Rezervasyonu kaydet</button>
</div>
</section>

</main>

<script>
const SUPABASE_URL = 'https://retdszkkqtxrcrbqqphw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w4DOGO1aaL04vHlxwXd4gA_NjGMU7bq';
const VAPID_PUBLIC = 'BBtX4eAJDu6gWidYpHT5BR43uNlzjuiPuJ17YXOFkmFet4UiE4ltlxLLJqsnh2yfT-xKLiq58xpj9ko-JbsbB-A';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const TZ = 'Europe/Nicosia';

let user = null;
let month = new Date();
let selDate = null;
let rows = [];
let chan = null;
let swReg = null;
let reloading = false;

month.setDate(1);

function toast(t) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = t;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 5000);
}

function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator();
    o.connect(c.destination);
    o.frequency.value = 880;
    o.start();
    o.stop(c.currentTime + .25);
  } catch(e) {}
}

function urlBase64ToUint8Array(b64) {
  const padding = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + padding).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function b64Url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/g, '');
}

const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const todayStr = () => {
  const d = new Date();
  return ymd(d.getFullYear(), d.getMonth(), d.getDate());
};
const isMon = s => new Date(s + 'T12:00:00').getDay() === 1;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));
const hhmm = t => String(t || '').slice(0, 5);
const entered = iso => new Date(iso).toLocaleString('tr-TR', {
  timeZone: TZ,
  day: '2-digit',
  month: '2-digit',
  hour: '2-digit',
  minute: '2-digit'
});

/* SERVICE WORKER */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  navigator.serviceWorker.register('./sw.js', {
    updateViaCache: 'none'
  }).then(async registration => {
    swReg = registration;
    await registration.update().catch(() => {});
    await checkPushState();
  }).catch(error => {
    console.error('Service Worker error:', error);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && swReg) {
      swReg.update().catch(() => {});
    }
  });
}

/* SCREEN NAVIGATION */
function show(v) {
  ['Login', 'Home', 'List', 'Form'].forEach(n => {
    $('v' + n).classList.toggle('hidden', n.toLowerCase() !== v);
  });

  $('logout').classList.toggle('hidden', v === 'login');

  if (v === 'home') checkPushState();
  if (v === 'list') loadMonth();
  if (v === 'form') prepForm();
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) show(g.dataset.go);
});

/* PUSH STATUS */
async function checkPushState() {
  const btn = $('pushBtn');
  const hint = $('pushHint');

  if (!btn || !hint) return;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    navigator.standalone === true;

  if (isIOS && !standalone) {
    btn.classList.add('hidden');
    hint.classList.remove('hidden');
    hint.textContent =
      'iPhone bildirimleri için Safari Paylaş menüsünden Ana Ekrana Ekle yapın ve uygulamayı ana ekrandan açın.';
    return;
  }

  if (!('Notification' in window) || !('PushManager' in window)) {
    btn.classList.add('hidden');
    hint.classList.remove('hidden');
    hint.textContent = 'Bu cihaz bildirim desteği sunmuyor.';
    return;
  }

  btn.classList.remove('hidden');
  hint.classList.add('hidden');

  if (Notification.permission === 'granted' && swReg) {
    const sub = await swReg.pushManager.getSubscription();

    if (sub) {
      btn.textContent = '✅ Bu Cihazda Bildirimler Açık';
      btn.classList.add('on');
      return;
    }
  }

  btn.textContent = '🔔 Kilit Ekranı Bildirimlerini Aç';
  btn.classList.remove('on');
}

/* PUSH SUBSCRIPTION */
$('pushBtn').onclick = async () => {
  const btn = $('pushBtn');
  btn.disabled = true;

  try {
    if (!user) throw new Error('Önce sisteme giriş yapın.');

    if (!('serviceWorker' in navigator) ||
        !('PushManager' in window) ||
        !('Notification' in window)) {
      throw new Error('Bu cihaz Web Push bildirimlerini desteklemiyor.');
    }

    const permission = await Notification.requestPermission();

    if (permission !== 'granted') {
      throw new Error('Bildirim izni verilmedi. Cihaz ayarlarından izin verin.');
    }

    const registration = await navigator.serviceWorker.ready;
    swReg = registration;

    let subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
    }

    const p256dh = subscription.getKey('p256dh');
    const auth = subscription.getKey('auth');

    if (!p256dh || !auth) {
      throw new Error('Abonelik anahtarları okunamadı.');
    }

    const { error } = await sb
      .from('push_subscriptions')
      .upsert({
        user_id: user.id,
        endpoint: subscription.endpoint,
        p256dh: b64Url(p256dh),
        auth: b64Url(auth)
      }, {
        onConflict: 'endpoint'
      });

    if (error) throw error;

    await registration.showNotification('Ottoman Kebab House', {
      body: 'Bu cihazın bildirim kurulumu tamamlandı.',
      icon: './icon-192.png',
      tag: 'ottoman-setup-test'
    });

    toast('Bildirim kurulumu tamamlandı!');
    await checkPushState();

  } catch (error) {
    console.error('Push setup error:', error);
    toast('Bildirim kurulamadı: ' + (error.message || error));
  } finally {
    btn.disabled = false;
  }
};

/* AUTHENTICATION */
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';

  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('pass').value
  });

  if (error) $('loginErr').textContent = 'E-posta veya şifre hatalı.';
};

$('logout').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((event, session) => {
  if (
    event === 'INITIAL_SESSION' ||
    event === 'SIGNED_IN' ||
    event === 'SIGNED_OUT'
  ) {
    setUser(session?.user || null);
  }
});

function setUser(u) {
  if (u && user && u.id === user.id) return;

  user = u;

  if (chan) {
    sb.removeChannel(chan);
    chan = null;
  }

  if (!u) {
    show('login');
    return;
  }

  $('hello').textContent =
    'Giriş yapan: ' + (u.user_metadata?.display_name || u.email);

  chan = sb.channel('rez')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'reservations'
    }, payload => {
      if (payload.eventType === 'INSERT') {
        const r = payload.new;

        const msg =
          `${r.first_name} ${r.last_name}, ` +
          `${String(r.res_date).split('-').reverse().join('.')} ` +
          `${hhmm(r.res_time)}, ${r.guests || '?'} pax ` +
          `(Rez alan: ${r.taken_by || '-'})`;

        beep();
        toast('Yeni rez: ' + msg);
      }

      if (!$('vList').classList.contains('hidden')) {
        loadMonth();
      }
    })
    .subscribe();

  show('home');
}

/* CALENDAR */
$('dows').innerHTML = [
  'Pzt','Sal','Çar','Per','Cum','Cmt','Paz'
].map(d => `<div class="dow">${d}</div>`).join('');

$('prev').onclick = () => {
  month.setMonth(month.getMonth() - 1);
  loadMonth();
};

$('next').onclick = () => {
  month.setMonth(month.getMonth() + 1);
  loadMonth();
};

async function loadMonth() {
  const y = month.getFullYear();
  const m = month.getMonth();
  const last = new Date(y, m + 1, 0).getDate();

  const { data, error } = await sb
    .from('reservations')
    .select('*')
    .gte('res_date', ymd(y, m, 1))
    .lte('res_date', ymd(y, m, last))
    .order('res_time');

  rows = error ? [] : data;

  if (error) {
    toast('Veriler alınamadı: ' + error.message);
  }

  if (!selDate || selDate.slice(0, 7) !== ymd(y, m, 1).slice(0, 7)) {
    const today = todayStr();
    selDate = today.slice(0, 7) === ymd(y, m, 1).slice(0, 7)
      ? today
      : ymd(y, m, 1);
  }

  drawCal();
  drawDay();
}

function drawCal() {
  const y = month.getFullYear();
  const m = month.getMonth();
  const last = new Date(y, m + 1, 0).getDate();

  $('monthLbl').textContent =
    month.toLocaleDateString('tr-TR', {
      month: 'long',
      year: 'numeric'
    });

  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const sum = {};

  rows.forEach(r => {
    sum[r.res_date] = (sum[r.res_date] || 0) + (r.guests || 0);
  });

  let html = '<div></div>'.repeat(lead);

  for (let d = 1; d <= last; d++) {
    const date = ymd(y, m, d);
    const off = isMon(date);

    html += `
      <button class="day${off ? ' off' : ''}${date === todayStr() ? ' today' : ''}${date === selDate ? ' sel' : ''}"
        data-d="${date}"${off ? ' disabled' : ''}>
        ${d}<i>${sum[date] || ''}</i>
      </button>`;
  }

  $('cal').innerHTML = html;

  $('cal').querySelectorAll('.day:not(.off)').forEach(button => {
    button.onclick = () => {
      selDate = button.dataset.d;
      drawCal();
      drawDay();
    };
  });
}

function drawDay() {
  const list = rows.filter(r => r.res_date === selDate);

  $('dayLbl').textContent = new Date(selDate + 'T12:00:00')
    .toLocaleDateString('tr-TR', {
      day: 'numeric',
      month: 'long',
      weekday: 'long'
    });

  $('items').innerHTML = list.length
    ? list.map(r => `
      <div class="item">
        <div class="top">
          <span class="nm">${esc(r.first_name)} ${esc(r.last_name)}</span>
          <span class="tm">${hhmm(r.res_time)}</span>
        </div>
        <div class="meta">
          <b>${r.guests || '?'} pax</b> · Rez alan:
          <b>${esc(r.taken_by || '-')}</b><br>
          Sisteme girilen: ${entered(r.created_at)}
          ${r.note ? '<br>Not: ' + esc(r.note) : ''}
        </div>
        <div class="row">
          <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>
          <button class="del" data-id="${r.id}">Sil</button>
        </div>
      </div>
    `).join('')
    : '<div class="empty">Bu gün için rezervasyon yok.</div>';

  $('totalPax').textContent =
    list.reduce((total, r) => total + (r.guests || 0), 0);

  $('items').querySelectorAll('.del').forEach(button => {
    button.onclick = async () => {
      if (!confirm('Bu rezervasyon silinsin mi?')) return;

      const { error } = await sb
        .from('reservations')
        .delete()
        .eq('id', button.dataset.id);

      if (error) {
        toast('Silinemedi: ' + error.message);
      } else {
        loadMonth();
      }
    };
  });
}

/* RESERVATION FORM */
$('addForDay').onclick = () => {
  show('form');
  $('fDate').value = selDate;
};

function prepForm() {
  ['fFirst','fLast','fTime','fPhone','fGuests','fNote']
    .forEach(id => $(id).value = '');

  $('fDate').value = selDate && !isMon(selDate) ? selDate : '';

  const shared = user.user_metadata?.shared;

  $('fTaker').value = shared
    ? ''
    : (user.user_metadata?.display_name || user.email);

  $('fTaker').readOnly = !shared;
  $('fTaker').placeholder = shared ? 'Adınızı yazın' : '';
  $('formErr').textContent = '';
}

$('saveBtn').onclick = async () => {
  const value = id => $(id).value.trim();
  const errorMessage = message => {
    $('formErr').textContent = message;
  };

  if (
    !value('fFirst') ||
    !value('fLast') ||
    !value('fDate') ||
    !value('fTime') ||
    !value('fPhone') ||
    !value('fGuests') ||
    !value('fTaker')
  ) {
    return errorMessage('Not hariç tüm alanları doldurun.');
  }

  if (isMon(value('fDate'))) {
    return errorMessage('Pazartesi günleri kapalı, başka bir gün seçin.');
  }

  if (+value('fGuests') < 1) {
    return errorMessage('Pax en az 1 olmalı.');
  }

  $('saveBtn').disabled = true;

  try {
    const { error } = await sb.from('reservations').insert({
      first_name: value('fFirst'),
      last_name: value('fLast'),
      res_date: value('fDate'),
      res_time: value('fTime'),
      phone: value('fPhone'),
      guests: +value('fGuests'),
      taken_by: value('fTaker'),
      note: value('fNote') || null
    });

    if (error) throw error;

    selDate = value('fDate');
    month = new Date(selDate + 'T12:00:00');
    month.setDate(1);

    toast('Rezervasyon kaydedildi.');
    show('list');

  } catch (error) {
    errorMessage('Kaydedilemedi: ' + (error.message || error));
  } finally {
    $('saveBtn').disabled = false;
  }
};
</script>
</body>
</html>
